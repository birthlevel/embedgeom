[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "birthlevel-embedgeom"
version = "0.1.0"
description = "计算有效维度数、方向性指标与近邻角度分布，评估嵌入是否退化"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "birthlevel" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://birthlevel.github.io"
Repository = "https://github.com/birthlevel/embedgeom"
Issues = "https://github.com/birthlevel/embedgeom/issues"

[project.scripts]
embedgeom = "embedgeom:main"

[tool.setuptools]
py-modules = ["embedgeom"]
